server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Docker'ın kendi iç DNS sunucusu. "app" adresini her seferinde
    # (10 saniyede bir) yeniden sorar, container yeniden başlayıp IP
    # değiştirse bile Nginx'in eski/ölü bir IP'ye takılı kalmasını önler.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # "app" adresi bir değişkene atanıyor; bu sayede Nginx bunu
        # yukarıdaki resolver ile dinamik olarak çözüyor, statik/kalıcı
        # bir IP'ye kilitlenmiyor.
        set $upstream_app app;
        fastcgi_pass $upstream_app:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # .env, .git gibi gizli tüm dosyalara erişimi engelle
    location ~ /\.(?!well-known).* {
        deny all;
    }
}